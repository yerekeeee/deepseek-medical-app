<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8FAFC">
<title>FirstAid KZ — первая помощь офлайн</title>
<style>
/* ============================================================
   DESIGN SYSTEM — FirstAid KZ
   ============================================================ */
:root{
  --bg:#F8FAFC;
  --surface:#FFFFFF;
  --text:#0F172A;
  --muted:#475569;
  --border:#E2E8F0;

  --sos:#DC2626;
  --sos-hover:#B91C1C;
  --red-soft:#FEF2F2;

  --accent:#0284C7;
  --accent-dark:#0369A1;
  --accent-soft:#E0F2FE;

  --green:#16A34A;
  --green-soft:#DCFCE7;

  --radius:16px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow:0 6px 20px rgba(15,23,42,.08);
  --t:.2s ease;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:92px;
}
body.no-scroll{overflow:hidden}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
button{font-family:inherit}
a{color:inherit}

/* ============================================================
   HEADER
   ============================================================ */
.app-header{
  position:sticky;top:0;z-index:60;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:1080px;margin:0 auto;
  padding:10px 16px;
  display:flex;align-items:center;gap:10px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:38px;height:38px;flex:none;border-radius:11px;
  background:var(--accent);color:#fff;
  display:grid;place-items:center;
  font-size:22px;font-weight:800;line-height:1;
  box-shadow:0 2px 10px rgba(2,132,199,.28);
}
.brand-col{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand-name{font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.offline{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  color:#15803D;background:var(--green-soft);
  padding:2px 7px;border-radius:6px;white-space:nowrap;
}
.offline::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}

.lang{display:flex;background:#F1F5F9;border-radius:10px;padding:3px;gap:2px}
.lang button{
  border:0;background:transparent;color:var(--muted);
  font-size:13px;font-weight:800;letter-spacing:.02em;
  padding:7px 10px;border-radius:8px;min-height:34px;cursor:pointer;
  transition:all var(--t);
}
.lang button:hover{color:var(--text)}
.lang button.active{background:#fff;color:var(--accent);box-shadow:var(--shadow-sm)}

.sos-btn{
  border:0;background:var(--sos);color:#fff;
  font-weight:800;font-size:13px;letter-spacing:.02em;
  padding:0 14px;min-height:44px;border-radius:11px;
  white-space:nowrap;cursor:pointer;
  box-shadow:0 2px 10px rgba(220,38,38,.3);
  transition:background var(--t),transform var(--t);
}
.sos-btn:hover{background:var(--sos-hover)}
.sos-btn:active{transform:scale(.97)}

@media (max-width:420px){
  .sos-btn{font-size:12px;padding:0 10px}
  .brand-name{font-size:14px}
}

/* ============================================================
   TAB BAR (mobile fixed / desktop inline)
   ============================================================ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:55;
  display:flex;gap:4px;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  border:0;background:transparent;color:var(--muted);
  font-size:11px;font-weight:700;line-height:1.15;
  padding:8px 4px;min-height:56px;border-radius:12px;cursor:pointer;
  transition:all var(--t);text-align:center;
}
.tab-ico{font-size:19px;line-height:1}
.tab.active{color:var(--accent);background:var(--accent-soft)}

@media (min-width:768px){
  body{padding-bottom:32px}
  .tabbar{
    position:static;max-width:1080px;margin:0 auto;
    background:transparent;border:0;padding:14px 16px 0;
    justify-content:flex-start;gap:8px;
  }
  .tab{
    flex:none;flex-direction:row;gap:8px;
    padding:10px 16px;min-height:44px;font-size:14px;
    background:#fff;border:1px solid var(--border);border-radius:12px;
  }
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tab:hover:not(.active){border-color:var(--accent);color:var(--accent)}
}

/* ============================================================
   MAIN LAYOUT
   ============================================================ */
main{max-width:1080px;margin:0 auto;padding:16px}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.page-sub{color:var(--muted);font-size:14px;margin-top:6px}

/* ---------- QR ---------- */
.qr-btn{
  width:100%;margin-top:16px;min-height:66px;
  display:flex;align-items:center;gap:12px;text-align:left;
  background:#fff;border:1.5px dashed var(--accent);
  border-radius:14px;padding:12px 14px;cursor:pointer;
  transition:background var(--t),transform var(--t);
}
.qr-btn:hover{background:var(--accent-soft)}
.qr-btn:active{transform:scale(.99)}
.qr-ico{
  width:40px;height:40px;flex:none;border-radius:11px;
  background:var(--accent-soft);color:var(--accent-dark);
  display:grid;place-items:center;font-size:19px;
}
.qr-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.qr-txt strong{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.qr-txt small{font-size:12px;color:var(--muted);line-height:1.35}

.note{
  display:flex;gap:8px;align-items:flex-start;
  margin-top:12px;padding:10px 12px;border-radius:12px;
  background:#F1F5F9;color:var(--muted);font-size:12.5px;line-height:1.45;
}

/* ---------- SCENARIO GRID ---------- */
.scenario-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px;
}
@media (min-width:600px){.scenario-grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media (min-width:900px){.scenario-grid{grid-template-columns:repeat(4,1fr)}}

.scenario-card{
  display:flex;flex-direction:column;align-items:flex-start;gap:8px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;min-height:118px;
  text-align:left;cursor:pointer;box-shadow:var(--shadow-sm);
  transition:transform var(--t),box-shadow var(--t),border-color var(--t);
}
.scenario-card:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
.scenario-card:active{transform:scale(.98)}
.sc-ico{font-size:24px;line-height:1}
.sc-title{font-size:15px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
.sc-meta{font-size:11.5px;font-weight:700;color:var(--muted);margin-top:auto}

/* ---------- PLAYER ---------- */
.player{max-width:720px;margin:0 auto;animation:fade .2s ease}
.link-btn{
  border:0;background:transparent;color:var(--accent);
  font-size:14px;font-weight:800;cursor:pointer;
  padding:8px 0;min-height:44px;
}
.link-btn:hover{color:var(--accent-dark)}
.player-head{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.player-icon{
  width:52px;height:52px;flex:none;border-radius:14px;
  background:var(--accent-soft);display:grid;place-items:center;font-size:26px;
}
.player-title{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.player-meta{font-size:13px;font-weight:700;color:var(--muted)}

.progress{height:6px;border-radius:99px;background:#E2E8F0;overflow:hidden;margin-bottom:14px}
.progress-fill{height:100%;border-radius:99px;background:var(--accent);transition:width var(--t)}

.step-card{
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow-sm);animation:fadeUp .2s ease;
}
.step-num{
  font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);margin-bottom:6px;
}
.step-card h2{font-size:19px;font-weight:800;line-height:1.3;letter-spacing:-.01em;margin-bottom:8px}
.step-card > p{font-size:15px;color:var(--muted);line-height:1.55}

.dont{
  margin-top:16px;padding:12px 14px;border-radius:12px;
  border:2px solid #FCA5A5;background:var(--red-soft);
}
.dont-head{
  display:flex;gap:6px;align-items:center;
  font-size:12px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;
  color:var(--sos);margin-bottom:5px;
}
.dont p{font-size:14px;line-height:1.5;color:#7F1D1D}

.player-nav{display:flex;gap:10px;margin-top:16px}

.btn{
  flex:1;min-height:54px;padding:0 16px;
  border-radius:14px;border:1px solid transparent;
  font-size:16px;font-weight:800;cursor:pointer;
  transition:background var(--t),color var(--t),border-color var(--t),transform var(--t);
}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(2,132,199,.26)}
.btn-primary:hover:not(:disabled){background:var(--accent-dark)}
.btn-secondary{background:#fff;color:var(--text);border-color:var(--border)}
.btn-secondary:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}

/* ---------- TRUST BADGE ---------- */
.trust{
  margin-top:14px;padding:12px 14px;border-radius:12px;
  background:#F0F9FF;border:1px dashed #BAE6FD;
}
.trust-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700}
.trust-check{
  width:18px;height:18px;flex:none;border-radius:50%;
  background:var(--green);color:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:900;
}
.trust-pill{
  font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;
  background:#fff;border:1px solid #BAE6FD;color:var(--accent-dark);
  border-radius:99px;padding:2px 8px;
}
.trust-meta{font-size:12px;font-weight:600;color:var(--muted);margin-top:6px}

/* ---------- QUIZ ---------- */
.quiz-wrap{max-width:720px;margin:0 auto;animation:fade .2s ease}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0 10px}
.quiz-count{font-size:13px;font-weight:700;color:var(--muted)}
.quiz-score{font-size:13px;font-weight:900;color:var(--accent)}
.quiz-card{
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow-sm);
}
.quiz-q{font-size:18px;font-weight:800;line-height:1.35;letter-spacing:-.01em;margin-bottom:14px}
.quiz-options{display:flex;flex-direction:column;gap:8px}
.quiz-option{
  display:flex;align-items:center;gap:10px;
  min-height:56px;padding:13px 14px;
  text-align:left;font-size:15px;font-weight:600;color:var(--text);
  background:#fff;border:1.5px solid var(--border);border-radius:12px;
  cursor:pointer;transition:all var(--t);
}
.quiz-option:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.quiz-option:disabled{cursor:default}
.opt-letter{
  width:26px;height:26px;flex:none;border-radius:8px;
  background:#F1F5F9;color:var(--muted);
  display:grid;place-items:center;font-size:12px;font-weight:900;
}
.quiz-option.is-correct{border-color:var(--green);background:#F0FDF4}
.quiz-option.is-correct .opt-letter{background:var(--green);color:#fff}
.quiz-option.is-wrong{border-color:var(--sos);background:var(--red-soft)}
.quiz-option.is-wrong .opt-letter{background:var(--sos);color:#fff}
.quiz-option.is-dim{opacity:.55}

.explain{
  margin-top:14px;padding:14px;border-radius:12px;
  font-size:14px;line-height:1.5;animation:fadeUp .2s ease;
}
.explain.ok{background:#F0FDF4;border:1px solid #BBF7D0;color:#166534}
.explain.bad{background:var(--red-soft);border:1px solid #FECACA;color:#991B1B}
.explain strong{display:block;margin-bottom:5px;font-size:14px}

.result{
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;text-align:center;box-shadow:var(--shadow-sm);
}
.result-label{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.result-score{font-size:46px;font-weight:900;letter-spacing:-.03em;color:var(--accent);line-height:1.1;margin-top:4px}
.result-msg{margin:12px 0 8px;font-size:15px;color:var(--muted);line-height:1.5}
.result-best{font-size:13px;color:var(--muted);margin-bottom:18px}

/* ---------- COURSES ---------- */
.course-grid{display:grid;gap:14px;margin-top:18px}
@media (min-width:760px){.course-grid{grid-template-columns:repeat(2,1fr)}}
.course-card{
  display:flex;flex-direction:column;
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow-sm);
  transition:box-shadow var(--t),border-color var(--t);
}
.course-card:hover{box-shadow:var(--shadow)}
.course-card.is-highlight{border-color:var(--accent)}
.course-card h2{font-size:17px;font-weight:800;line-height:1.3;letter-spacing:-.01em}
.course-badge{
  align-self:flex-start;margin-top:8px;
  font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;
  background:var(--accent-soft);color:var(--accent-dark);
  padding:3px 9px;border-radius:99px;
}
.course-price{font-size:26px;font-weight:900;letter-spacing:-.02em;margin:12px 0 10px}
.course-features{display:flex;flex-direction:column;gap:7px;font-size:13.5px;color:var(--muted);margin-bottom:18px}
.course-features li{display:flex;gap:8px;line-height:1.4}
.course-features li::before{content:"✓";color:var(--green);font-weight:900;flex:none}
.course-card .btn{margin-top:auto}

/* ============================================================
   MODALS
   ============================================================ */
.overlay{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  background:rgba(15,23,42,.55);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:fade .18s ease;
}
@media (min-width:600px){.overlay{align-items:center;padding:24px}}

.modal{
  width:100%;max-width:520px;max-height:92vh;overflow:auto;
  background:#fff;border-radius:20px 20px 0 0;
  padding:20px;animation:slideUp .2s ease;
}
@media (min-width:600px){
  .modal{border-radius:20px;animation:pop .2s ease}
}

.modal-head{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.modal h2{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.modal-sub{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.45}
.icon-btn{
  flex:none;width:36px;height:36px;border:0;border-radius:10px;
  background:#F1F5F9;color:var(--muted);font-size:16px;cursor:pointer;
  transition:all var(--t);
}
.icon-btn:hover{background:#E2E8F0;color:var(--text)}

.call-btn{
  display:flex;align-items:center;gap:12px;
  margin-top:12px;padding:13px 16px;min-height:66px;
  border-radius:14px;color:#fff;text-decoration:none;
  transition:background var(--t),transform var(--t);
}
.call-btn:active{transform:scale(.98)}
.call-112{background:var(--sos)}
.call-112:hover{background:var(--sos-hover)}
.call-103{background:var(--accent)}
.call-103:hover{background:var(--accent-dark)}
.call-num{font-size:25px;font-weight:900;letter-spacing:-.02em;line-height:1}
.call-name{font-size:13.5px;font-weight:700;opacity:.95;line-height:1.25}
.call-arrow{margin-left:auto;font-size:18px;opacity:.9}

.memo{margin-top:18px;padding:14px;border-radius:14px;background:#F8FAFC;border:1px solid var(--border)}
.memo h3{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
.memo li{display:flex;gap:8px;font-size:13.5px;line-height:1.45;padding:5px 0;color:var(--text)}
.memo li::before{content:"•";color:var(--accent);font-weight:900;flex:none}
.sos-note{
  margin-top:14px;padding:10px 12px;border-radius:12px;
  background:var(--accent-soft);color:var(--accent-dark);
  font-size:12.5px;line-height:1.45;
}

/* ---------- FORM ---------- */
.field{margin-top:12px}
.field label{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:5px}
.field input{
  width:100%;min-height:50px;padding:0 14px;
  font-family:inherit;font-size:15px;color:var(--text);
  background:#fff;border:1.5px solid var(--border);border-radius:12px;
  transition:border-color var(--t);
}
.field input:focus{outline:none;border-color:var(--accent)}

/* ---------- QR SCANNER ---------- */
.qr-frame{
  position:relative;width:200px;height:200px;margin:22px auto;
  border-radius:18px;background:#0F172A;overflow:hidden;
  display:grid;place-items:center;font-size:64px;
}
.qr-frame::before,.qr-frame::after{
  content:"";position:absolute;width:38px;height:38px;
  border:3px solid var(--green);border-radius:8px;
}
.qr-frame::before{top:14px;left:14px;border-right:0;border-bottom:0}
.qr-frame::after{bottom:14px;right:14px;border-left:0;border-top:0}
.qr-scanline{
  position:absolute;left:10px;right:10px;height:3px;
  background:var(--green);border-radius:99px;
  box-shadow:0 0 14px 2px rgba(22,163,74,.85);
  animation:scan 1.5s ease-in-out infinite;
}
.qr-center{text-align:center;color:var(--muted);font-size:14px;font-weight:700}

/* ---------- ANIMATIONS ---------- */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{transform:translateY(24px)}to{transform:translateY(0)}}
@keyframes scan{0%{top:14%}50%{top:84%}100%{top:14%}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner" id="headerInner"></div>
</header>

<nav class="tabbar" id="tabbar" aria-label="Навигация / Навигация"></nav>

<main id="app"></main>

<div id="modalRoot"></div>

<script>

/* ============================================================
   2. STATE + STORAGE
   ============================================================ */
const STORAGE_KEY = "firstaid_kz_v1";

const state = {
  lang: "ru",
  tab: "emergency",
  scenarioId: null,
  step: 0,
  quizIndex: 0,
  quizScore: 0,
  quizAnswered: false,
  quizSelected: null,
  quizFinished: false,
  modal: null
};

let qrTimer = null;

const store = {
  read() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch (e) {
      return {};
    }
  },
  write(patch) {
    try {
      const data = Object.assign(this.read(), patch);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      /* localStorage может быть недоступен */
    }
  }
};

const T = () => APP_DATA[state.lang];
const $ = (sel, root) => (root || document).querySelector(sel);

/* ---------- Пошаговый плеер ---------- */
function scenarioPlayerHTML() {
  const t = T();
  const sc = t.scenarios.find(s => s.id === state.scenarioId);
  if (!sc) return scenariosHTML();

  const total = sc.steps.length;
  const step = sc.steps[state.step];
  const isLast = state.step === total - 1;
  const pct = Math.round(((state.step + 1) / total) * 100);

  return `
    <section class="player">
      <button type="button" class="link-btn" data-action="exit-scenario">← ${t.ui.backToList}</button>

      <div class="player-head">
        <div class="player-icon" aria-hidden="true">${sc.icon}</div>
        <div>
          <h1 class="player-title">${sc.title}</h1>
          <div class="player-meta">${t.ui.step} ${state.step + 1} ${t.ui.of} ${total}</div>
        </div>
      </div>

      <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>

      <article class="step-card">
        <div class="step-num">${t.ui.step} ${state.step + 1}</div>
        <h2>${step.title}</h2>
        <p>${step.text}</p>
        <div class="dont">
          <div class="dont-head"><span aria-hidden="true">✕</span> ${t.ui.dontTitle}</div>
          <p>${step.dont}</p>
        </div>
      </article>

      <div class="player-nav">
        <button type="button" class="btn btn-secondary" data-action="prev" ${state.step === 0 ? "disabled" : ""}>
          ${t.ui.back}
        </button>
        <button type="button" class="btn btn-primary" data-action="next">
          ${isLast ? t.ui.finish : t.ui.next}
        </button>
      </div>

      <div class="trust">
        <div class="trust-row">
          <span class="trust-check" aria-hidden="true">✓</span>
          <span>${t.ui.trustTitle}</span>
          <span class="trust-pill">${t.ui.trustNoAi}</span>
        </div>
        <div class="trust-meta">
          ${t.ui.protocol} ${sc.trust.version} · ${t.ui.checked} ${sc.trust.date} · ${sc.trust.source}
        </div>
      </div>
    </section>
  `;
}

/* ---------- Квиз ---------- */
function quizHTML() {
  const t = T();
  if (state.quizFinished) return quizResultHTML();

  const q = t.quiz[state.quizIndex];
  const total = t.quiz.length;
  const letters = ["A", "B", "C", "D"];
  const isLast = state.quizIndex === total - 1;

  const options = q.options.map((opt, i) => {
    let cls = "quiz-option";
    if (state.quizAnswered) {
      if (i === q.correct) cls += " is-correct";
      else if (i === state.quizSelected) cls += " is-wrong";
      else cls += " is-dim";
    }
    return `
      <button type="button" class="${cls}" data-action="quiz-answer" data-index="${i}"
        ${state.quizAnswered ? "disabled" : ""}>
        <span class="opt-letter">${letters[i]}</span>
        <span>${opt}</span>
      </button>
    `;
  }).join("");

  const isRight = state.quizSelected === q.correct;

  const explain = state.quizAnswered ? `
    <div class="explain ${isRight ? "ok" : "bad"}">
      <strong>${isRight ? "✓ " + t.ui.correct : "✕ " + t.ui.wrong}</strong>
      ${isRight ? "" : `${t.ui.correctAnswer} <b>${q.options[q.correct]}</b><br><br>`}
      ${q.explain}
    </div>
    <button type="button" class="btn btn-primary" style="width:100%;margin-top:14px" data-action="quiz-next">
      ${isLast ? t.ui.showResult : t.ui.nextQuestion}
    </button>
  ` : "";

  return `
    <section class="quiz-wrap">
      <h1 class="page-title">${t.ui.quizTitle}</h1>
      <p class="page-sub">${t.ui.quizSub}</p>

      <div class="quiz-top">
        <span class="quiz-count">${t.ui.question} ${state.quizIndex + 1} / ${total}</span>
        <span class="quiz-score">${state.quizScore} / ${total}</span>
      </div>

      <div class="quiz-card">
        <div class="quiz-q">${q.q}</div>
        <div class="quiz-options">${options}</div>
        ${explain}
      </div>
    </section>
  `;
}

function quizResultHTML() {
  const t = T();
  const total = t.quiz.length;
  const score = state.quizScore;
  const best = store.read().quizBest || 0;
  const msg = score === total ? t.ui.perfect : (score >= Math.ceil(total * 0.6) ? t.ui.good : t.ui.low);

  return `
    <section class="quiz-wrap">
      <h1 class="page-title">${t.ui.result}</h1>
      <div class="result" style="margin-top:16px">
        <div class="result-label">${t.ui.yourScore}</div>
        <div class="result-score">${score} / ${total}</div>
        <p class="result-msg">${msg}</p>
        <p class="result-best">${t.ui.bestScore}: <b>${best} / ${total}</b> · ${t.ui.quizSaved}</p>
        <button type="button" class="btn btn-primary" style="width:100%" data-action="quiz-retry">
          ${t.ui.retry}
        </button>
      </div>
    </section>
  `;
}

function renderModal() {
  const root = $("#modalRoot");

  if (!state.modal) {
    root.innerHTML = "";
    document.body.classList.remove("no-scroll");
    return;
  }

  document.body.classList.add("no-scroll");

  let html = "";
  if (state.modal.type === "sos") html = sosModalHTML();
  else if (state.modal.type === "qr") html = qrModalHTML();
  else if (state.modal.type === "success") html = successModalHTML();
  else if (state.modal.type === "course") {
    const course = T().courses.find(c => c.id === state.modal.id);
    if (course) html = courseModalHTML(course);
  }

  root.innerHTML = html;
}

function closeModal() {
  if (qrTimer) {
    clearTimeout(qrTimer);
    qrTimer = null;
  }
  state.modal = null;
  renderModal();
}

/* ============================================================
   6. ACTIONS
   ============================================================ */
function setLang(lang) {
  if (lang !== "ru" && lang !== "kz") return;
  if (state.lang === lang) return;
  state.lang = lang;
  store.write({ lang });
  render();
}

function setTab(tabId) {
  state.tab = tabId;
  if (tabId !== "emergency") state.scenarioId = null;
  if (tabId !== "quiz") {
    /* состояние квиза сохраняем, чтобы не терять прогресс */
  }
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function openScenario(id) {
  state.tab = "emergency";
  state.scenarioId = id;
  state.step = 0;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function exitScenario() {
  state.scenarioId = null;
  state.step = 0;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function prevStep() {
  if (state.step > 0) {
    state.step -= 1;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function nextStep() {
  const sc = T().scenarios.find(s => s.id === state.scenarioId);
  if (!sc) return;
  if (state.step < sc.steps.length - 1) {
    state.step += 1;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    exitScenario();
  }
}

function openQR() {
  state.modal = { type: "qr" };
  renderModal();

  qrTimer = setTimeout(() => {
    qrTimer = null;
    state.modal = null;
    state.tab = "emergency";
    state.scenarioId = "bleeding";
    state.step = 0;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, 2200);
}

function answerQuiz(index) {
  if (state.quizAnswered) return;
  const q = T().quiz[state.quizIndex];
  state.quizAnswered = true;
  state.quizSelected = index;
  if (index === q.correct) state.quizScore += 1;
  render();
}

function nextQuiz() {
  const total = T().quiz.length;
  if (state.quizIndex < total - 1) {
    state.quizIndex += 1;
    state.quizAnswered = false;
    state.quizSelected = null;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    state.quizFinished = true;
    const best = Math.max(store.read().quizBest || 0, state.quizScore);
    store.write({
      quizBest: best,
      quizLast: state.quizScore,
      quizDate: new Date().toISOString().slice(0, 10)
    });
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function retryQuiz() {
  state.quizIndex = 0;
  state.quizScore = 0;
  state.quizAnswered = false;
  state.quizSelected = null;
  state.quizFinished = false;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ============================================================
   7. EVENT DELEGATION
   ============================================================ */
document.addEventListener("click", event => {
  const el = event.target.closest("[data-action]");
  if (!el) return;

  const action = el.dataset.action;

  switch (action) {
    case "lang":
      setLang(el.dataset.lang);
      break;

    case "tab":
      setTab(el.dataset.tab);
      break;

    case "sos":
      state.modal = { type: "sos" };
      renderModal();
      break;

    case "close-modal":
      /* закрываем только при клике по оверлею или по кнопке закрытия */
      if (el.classList.contains("overlay") && event.target !== el) return;
      closeModal();
      break;

    case "open-scenario":
      openScenario(el.dataset.id);
      break;

    case "exit-scenario":
      exitScenario();
      break;

    case "prev":
      prevStep();
      break;

    case "next":
      nextStep();
      break;

    case "qr":
      openQR();
      break;

    case "quiz-answer":
      answerQuiz(Number(el.dataset.index));
      break;

    case "quiz-next":
      nextQuiz();
      break;

    case "quiz-retry":
      retryQuiz();
      break;

    case "open-course":
      state.modal = { type: "course", id: el.dataset.id };
      renderModal();
      break;

    default:
      break;
  }
});

document.addEventListener("submit", event => {
  if (event.target.id !== "leadForm") return;
  event.preventDefault();

  const name = ($("#fName") || {}).value || "";
  const phone = ($("#fPhone") || {}).value || "";
  const org = ($("#fOrg") || {}).value || "";

  if (!name.trim() || !phone.trim()) {
    const firstEmpty = !name.trim() ? $("#fName") : $("#fPhone");
    if (firstEmpty) firstEmpty.focus();
    return;
  }

  store.write({
    lastLead: {
      name: name.trim(),
      phone: phone.trim(),
      org: org.trim(),
      courseId: state.modal ? state.modal.id : null,
      date: new Date().toISOString()
    }
  });

  state.modal = { type: "success" };
  renderModal();
});

/* Закрытие модалок по Escape */
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && state.modal) closeModal();
});

/* ============================================================
   8. RENDER ROOT + INIT
   ============================================================ */
function render() {
  document.documentElement.lang = state.lang === "kz" ? "kk" : "ru";
  document.title = state.lang === "kz"
    ? "FirstAid KZ — алғашқы көмек офлайн"
    : "FirstAid KZ — первая помощь офлайн";

  renderHeader();
  renderTabs();
  renderMain();
  renderModal();
}

function init() {
  const saved = store.read();
  if (saved.lang === "kz" || saved.lang === "ru") {
    state.lang = saved.lang;
  }
  render();
}

init();
</script>
</body>
